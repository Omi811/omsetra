name: Import reviewed Omsetra source once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omsetra-reviewed-source-import
  cancel-in-progress: false

jobs:
  import-source:
    if: github.repository == 'Omi811/omsetra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Verify and import the published source snapshot
        shell: python
        run: |
          import hashlib, json, pathlib, stat, zipfile

          root = pathlib.Path.cwd().resolve()
          archive = root / 'omsetra-application-source.zip'
          destination = root / 'application'
          expected = '9779e017551d6caac15a2dba203cb691aaf8e76d4665f77c47d37f6e143e798f'
          if destination.exists():
              raise SystemExit('application/ already exists; refusing to overwrite source.')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Published archive checksum does not match the reviewed snapshot.')

          with zipfile.ZipFile(archive) as bundle:
              files = {}
              for entry in bundle.infolist():
                  if entry.is_dir():
                      continue
                  relative = pathlib.PurePosixPath(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts or '\\' in entry.filename:
                      raise SystemExit('Unsafe archive path.')
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Archive symlinks are not allowed.')
                  if any(part in {'.git', '.wrangler', '.sites-runtime', 'node_modules', 'dist'}
                         or part.startswith(('.env', '.dev.vars')) for part in relative.parts):
                      raise SystemExit('Private or generated archive content is not allowed.')
                  if relative.suffix.lower() in {'.pem', '.key', '.db', '.sqlite', '.sqlite3'}:
                      raise SystemExit('Private key or database content is not allowed.')
                  name = relative.as_posix()
                  content = bundle.read(entry)
                  if name in files and files[name] != content:
                      raise SystemExit('Conflicting duplicate file in archive: ' + name)
                  files[name] = content

          manifest = {}
          for line in files['SOURCE-SHA256.txt'].decode().splitlines():
              digest, name = line.split('  ', 1)
              if name in manifest:
                  raise SystemExit('Duplicate manifest entry.')
              manifest[name] = digest
          if len(manifest) != 183 or set(files) != set(manifest) | {'SOURCE-SHA256.txt', 'SOURCE-SNAPSHOT.json'}:
              raise SystemExit('Unexpected archive file inventory.')
          for name, digest in manifest.items():
              if hashlib.sha256(files[name]).hexdigest() != digest:
                  raise SystemExit('Source checksum mismatch: ' + name)
          snapshot = json.loads(files['SOURCE-SNAPSHOT.json'])
          if snapshot.get('livePaymentsEnabled') is not False:
              raise SystemExit('The snapshot must keep live payments disabled.')
          hosting = json.loads(files['.openai/hosting.json'])
          if 'project_id' in hosting:
              raise SystemExit('A production hosting identity must not be imported.')

          for name, content in files.items():
              target = destination.joinpath(*pathlib.PurePosixPath(name).parts)
              if not target.resolve().is_relative_to(destination):
                  raise SystemExit('Destination escaped application/.')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)

          readme = root / 'README.md'
          readme_text = readme.read_text().replace(
              'The source is currently packaged as an archive rather than a browsable application tree. Publishing this snapshot does not move the production database or configure automatic deployment from GitHub.',
              'The application source is now browsable under application/. The historical ZIP remains available. The production database and application hosting remain separate; automatic deployment from GitHub is not configured.')
          readme.write_text(readme_text + '''

          ## Browse the application source

          The full tracked application source is now committed under [application/](application/), including APIs, UI, database migrations, tests and the dependency lockfile. The historical ZIP remains available as a snapshot. Existing product pages and campaign documents remain at the repository root.

          For local development, install Node.js 22.13 or newer, then run `cd application`, `npm ci` and `npm run dev`. See [application/SETUP.md](application/SETUP.md) for D1 migrations and authentication requirements.

          Live payments remain disabled pending Razorpay approval, configuration and testing. This source import does not deploy the app, transfer the database, configure provider credentials or enable payments. The existing application hosting remains separate.
          ''')
          guide = root / 'SOURCE-GUIDE.md'
          guide.write_text('''# Application source

          The browsable source tree is now in [application/](application/). It contains 183 tracked source files from commit `4645ec0d544950f281a2b5774f42f54ba340e82b`, plus the snapshot metadata and per-file checksums. The original ZIP remains as a historical snapshot.

          ## Local development

          Install Node.js 22.13 or newer and Git. Run `cd application`, `npm ci`, then `npm run dev`. A fresh local D1 database requires the migrations described in [application/README.md](application/README.md) and [application/SETUP.md](application/SETUP.md). Portable mock identity is for loopback development only.

          ## Publication boundaries

          Credentials, environment files, production databases, user uploads, Git history and the original hosting project ID are excluded. All 183 file checksums and the archive SHA-256 were verified before import. Existing application code was preserved byte for byte.

          GitHub Pages serves the static product-information page only. The authenticated application and database stay on existing hosting. No automatic deployment synchronization has been configured. Live payments remain disabled pending Razorpay approval, configuration and testing.

          No open-source license for Omsetra has been selected. Retain all included third-party license notices. Source availability does not itself grant an open-source license.
          ''')
          tracker = root / 'PROMOTION-TRACKER.md'
          tracker.write_text(tracker.read_text() + '''

          ## Source-tree import completed

          All 183 tracked source files are now browsable under [application/](application/), with every file hash verified against the published snapshot. The previous ZIP-only limitation is resolved. Automatic deployment synchronization and moving the production database remain outside this import. No payment settings were changed.
          ''')
          print('Verified and imported 183 tracked application files plus 2 snapshot metadata files.')
      - name: Commit the source tree and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- application README.md SOURCE-GUIDE.md PROMOTION-TRACKER.md
          git rm -- .github/workflows/import-reviewed-source.yml
          git diff --cached --stat
          git commit -m 'Import verified application source tree; preserve disabled payments'
          git push origin HEAD:main
